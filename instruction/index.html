<!DOCTYPE html>

<body>
    <main class="container">
        <div class="col">
            <h1>操作手順</h1>
            <h2>&lt; SDカードの取り出し &gt;</h2>
            <h3>インクカスカス通常レジ(XE-A207)</h3>
            <P style="text-align:justify;">
                1. モード切替を押す<br>
                2. SDカードを選択<br>
                3. 書き込みのみを選択<br>
                4. 電子ジャーナルを選択<br>
                5. 実行を選択<br>
                6. 実行前の画面に戻ったらSDカードを取り出す
            </P>
            <h3>インクしっかり臨時レジ(XE-A147)</h3>
            <P style="text-align:justify;">
                0. 通常通り締め作業(キーを精算に合わせ現/預/替を押す)を行う<br>
                1. 印字が終わったらSDカードを取り出す
            </P>
            <h3>ジャーナル保存場所</h3>
            <p>SHARP > ECRXXX10/15 > WCOOP > EJ > yymmdd-n > EJFILE.txt</p>
            <div class="pageBack">
                <a href="/sales-ej/">
                    <i class="fas fa-arrow-left"></i> 戻る
                </a>
            </div>
        </div>
    </main>
</body>
